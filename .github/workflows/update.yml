name: Update movies and publish site

on:
  schedule:
    # IMDb regenerates its datasets once a day. GitHub drops scheduled runs now and then,
    # so a second, later run catches a missed one (it changes nothing if the first one ran).
    # Both start about 5.5 hours late in practice, so these aim for roughly 9:05 and 15:00.
    - cron: "35 3 * * *"
      timezone: Europe/Berlin
    - cron: "30 9 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:       # "Run workflow" button on the Actions tab
  push:                    # republish when the page or the data is changed by hand
    branches: [master]
    paths: [web/**, merged.tsv, .github/workflows/update.yml]

permissions:
  contents: write  # commit merged.tsv
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build (without the Windows .exe)
        run: mvn -B -q package -Dexec.skip=true
      # Annotations are public, unlike job logs, so this shows whether the secret is set (never its value)
      - name: Check TMDb token
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          if [ -n "$TMDB_API_TOKEN" ]; then
            echo "::notice::TMDB_API_TOKEN secret is set; the TMDb country lookup will run"
          else
            echo "::warning::TMDB_API_TOKEN secret is not set; the TMDb country lookup will be skipped"
          fi
      - name: Update merged.tsv
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: java --enable-preview -Djava.awt.headless=true -cp "target/libs/*" org.example.FilterAndJoinTsv --update
      - name: Commit merged.tsv if it changed
        run: |
          if git diff --quiet merged.tsv; then
            echo "merged.tsv unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update merged.tsv" merged.tsv
          # master may have moved on during the run (a push, or a re-run of an older run)
          git pull --rebase origin master
          git push origin HEAD:master

  publish:
    needs: update
    # Also runs when update was skipped (a push), but not after it failed
    if: ${{ !cancelled() && needs.update.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master  # includes the merged.tsv the update job just pushed
      - run: cp merged.tsv web/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
